[package]
name = "app"
version = "1.3.3"
description = "御钥师 (Git Keymaster) - 本地 Git 多账号/身份保险库与智能识别管理"
authors = ["Jeck"]
license = ""
repository = "https://github.com/ice-juice/git-keymaster-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

# ---- M1 加密栈 ----
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# ---- M2 SSH 资产读取/导入 ----
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "std", "getrandom"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }

# ---- M3 写操作/预览 ----
similar = "2"

# ---- M5 仓库/地址识别/PAT ----
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "socks"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2"
url = "2"
semver = "1"

# ---- 2FA / 账号管理 ----
data-encoding = "2.6"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "bmp", "gif"] }
rqrr = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["image"] }

# ---- 桌面专属 ----
# 注意：Cargo 的 target cfg 表达式**不认** Tauri 的 `desktop` / `mobile` 别名
# （那是 tauri-build 注入的 rustc cfg，只能写在源码里），所以这里必须显式列举 target_os。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
arboard = "3"
tauri-plugin-updater = "2"

# 屏幕扫码只在 Windows / macOS 上编：
# - Linux 上 xcap 强制拉 pipewire 0.10 / libspa，和 Ubuntu 22.04 的头文件对不上；
# - Android / iOS 没有"截屏找二维码"这回事，改用相机扫码。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-future = "0.2"

# 注意：`target_os = "macos"` **不覆盖 iOS**。M13 接 iOS 生物识别时，
# 需共享的条目要显式改成 cfg(any(target_os = "macos", target_os = "ios"))。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
    "std",
    "LABiometryType",
    "LAContext",
    "LAError",
    "block2",
] }

# 原生文件选择器只给非 Windows 的桌面平台；移动端走 tauri-plugin-dialog / SAF。
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rfd = "0.15"
