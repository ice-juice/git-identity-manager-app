<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"></head>
<body><div class="window">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">Git 多账号管理器 · 首次初始化</span>
  </div>
  <div class="body">
    <div class="center-stage">
      <div class="wizard">
        <div class="wizard-head">
          <div class="title-lg">创建加密工作空间</div>
          <div class="muted">工作空间用于加密保存你所有的密钥与私密文件</div>
          <div class="steps">
            <div class="step done"><span class="n">✓</span>选择目录</div>
            <div class="step done"><span class="n">✓</span>访问密码</div>
            <div class="step active"><span class="n">3</span>恢复密钥</div>
            <div class="step"><span class="n">4</span>回填校验</div>
            <div class="step"><span class="n">5</span>导入密钥</div>
          </div>
        </div>
        <div class="wizard-body">
          <div class="section-title">🔑 这是你的数据恢复密钥</div>
          <div class="reckey">GAM1-K7X2-9MQR-4TWB<br>8FHV-3NCD-6JYP-2SZG<br>5LKA-7RXE-9BTM-H3N8</div>
          <div class="row" style="justify-content:center;gap:10px;margin:16px 0">
            <button class="btn sm">📋 复制</button>
            <button class="btn sm">💾 导出 TXT</button>
            <button class="btn sm">▦ 二维码</button>
            <button class="btn sm">🖨 打印</button>
          </div>
          <div class="callout danger">
            <span>⚠</span>
            <div><b>请立刻离线保存这把密钥。</b>它是忘记访问密码、或换电脑从云端恢复时<b>唯一</b>能解开数据的凭证。我们不保存它，一旦与访问密码同时丢失，数据将永久无法恢复——没有任何后门。</div>
          </div>
        </div>
        <div class="wizard-foot">
          <button class="btn ghost">← 上一步</button>
          <button class="btn primary">我已安全保存，继续 →</button>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
