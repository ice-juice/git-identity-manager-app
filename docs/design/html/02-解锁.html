<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"></head>
<body><div class="window">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">Git 多账号管理器</span>
    <span class="spacer"></span>
    <span class="lockstate"><span class="lk" style="background:var(--red)"></span>已锁定</span>
  </div>
  <div class="body">
    <div class="center-stage">
      <div style="width:400px;text-align:center;color:#fff">
        <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 22px">🔑</div>
        <div style="font-size:22px;font-weight:700;margin-bottom:6px">工作空间已锁定</div>
        <div style="color:#94a3b8;font-size:13px;margin-bottom:28px">D:\GitVault · juice 的工作空间</div>
        <div class="card" style="padding:24px;text-align:left">
          <div class="field" style="margin-bottom:14px">
            <label>访问密码</label>
            <input class="input" type="password" value="••••••••••••" style="letter-spacing:3px">
          </div>
          <button class="btn primary lg" style="width:100%;justify-content:center">解锁</button>
          <div style="display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--text-mute);font-size:12.5px;justify-content:center">
            <span>👆 使用 Windows Hello</span><span>·</span><span>用恢复密钥解锁</span>
          </div>
        </div>
        <div style="color:#64748b;font-size:12px;margin-top:18px">忘记访问密码？只能用初始化时保存的恢复密钥找回，且无法重置。</div>
      </div>
    </div>
  </div>
</div></body></html>
